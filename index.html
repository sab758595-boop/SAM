<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Mitu ❤️</title>
<style>
body{margin:0;background:#050816;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
#c{text-align:center;max-width:700px;padding:20px}
button{padding:14px 26px;border:none;border-radius:30px;font-size:20px;cursor:pointer}
.hidden{display:none}
h1{color:#ff77aa}
.heart{position:fixed;color:#ff5c8a;animation:up 6s linear infinite}
@keyframes up{from{transform:translateY(110vh)}to{transform:translateY(-10vh)}}
</style></head><body>
<div id="c">
<div id="start"><h1>❤️ Tap to Open ❤️</h1><button onclick="go()">Open My Surprise</button></div>
<div id="msg" class="hidden"><h1>For My Beloved Wife, Mitu ❤️</h1><p id="t"></p></div>
</div>
<script>
const text=`Dear Mitu,

Every day with you is the most beautiful chapter of my life.

I want to hold your hand today, tomorrow and forever.

I Love You More Than Words Can Ever Say.

Forever Yours,
Sabbir ❤️`;
function go(){start.classList.add('hidden');msg.classList.remove('hidden');let i=0;let e=document.getElementById('t');let s=setInterval(()=>{e.innerHTML=text.slice(0,i++).replace(/\n/g,"<br>");if(i>text.length)clearInterval(s);},40);}
setInterval(()=>{let d=document.createElement('div');d.className='heart';d.textContent='❤';d.style.left=Math.random()*100+'vw';d.style.fontSize=(16+Math.random()*24)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)},350);
</script></body></html>
